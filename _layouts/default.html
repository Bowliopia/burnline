<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GXRVHPPRK5"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-GXRVHPPRK5');
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="{{ page.theme_color | default: '#f4efd9' }}" />
  <meta name="description" content="{{ page.description | escape }}" />
  <title>{{ page.title }}</title>

  <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  {% if page.story_jsonld %}
  {% include story-jsonld.html %}
  {% endif %}

  <link rel="stylesheet" href="/css/style.css">
  {% if page.extra_css %}
  <link rel="stylesheet" href="{{ page.extra_css }}">
  {% endif %}
</head>

<body{% if page.body_class %} class="{{ page.body_class }}"{% endif %}>
  {% include header.html %}

  {{ content }}

  {% include footer.html %}

  <script src="https://f.convertkit.com/ckjs/ck.5.js"></script>
  <script src="/assets/js/site.js"></script>
  {% if page.extra_script %}
  <script src="{{ page.extra_script }}"></script>
  {% endif %}
</body>
</html>
